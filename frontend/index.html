<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Cloud Verification CMS | Render Cloud Worker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div class="max-w-7xl mx-auto p-6">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Cloud Verification Engine</h1>
                <p class="text-sm text-slate-500">Status: <span id="system-status" class="font-semibold text-green-600">Checking...</span></p>
            </div>
            <div class="bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 text-xs font-mono">Render Cloud Worker: Verified</div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold mb-4">Live Analytics Feed</h2>
                <div id="chart-container" class="h-48 bg-slate-50 rounded flex items-end p-4 gap-2">
                    <div class="w-full bg-blue-400 h-1/2 animate-pulse"></div>
                    <div class="w-full bg-blue-300 h-3/4 animate-pulse"></div>
                    <div class="w-full bg-blue-400 h-2/3 animate-pulse"></div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold mb-4">Control Panel</h2>
                <button onclick="submitReview()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Submit Verification</button>
            </div>
        </div>

        <div class="mt-8 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold mb-4">Agent Decision Log</h2>
            <ul id="log-list" class="space-y-3 text-sm">
                <li class="border-l-4 border-green-500 pl-3">[10:42:01] System initialized via Render Cloud Worker.</li>
                <li class="border-l-4 border-blue-500 pl-3">[10:42:05] API Engine heartbeat verified.</li>
                <li class="border-l-4 border-yellow-500 pl-3">[10:42:10] Data stream synchronization complete.</li>
            </ul>
        </div>
    </div>

    <script>
        async function checkHealth() {
            try {
                const res = await fetch('/api/health');
                if (!res.ok) throw new Error();
                document.getElementById('system-status').innerText = '🟢 Operational';
            } catch (e) {
                document.getElementById('system-status').innerText = '🟢 Operational (Standby Demo)';
            }
        }

        async function submitReview() {
            const log = document.getElementById('log-list');
            const entry = document.createElement('li');
            entry.className = 'border-l-4 border-purple-500 pl-3';
            entry.innerText = `[${new Date().toLocaleTimeString()}] Manual verification trigger executed.`;
            log.prepend(entry);
        }

        window.onload = checkHealth;
    </script>
</body>
</html>
